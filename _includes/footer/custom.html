<!-- start custom footer snippets -->
<div class="cna-footer-pills">
  <a href="https://github.com/Cryptology-Algorithm-Lab" target="_blank" rel="noopener noreferrer"
     title="Cryptology & Algorithm Lab on GitHub"
     class="cna-footer-pill">
    <i class="fab fa-github"></i>
    <span>Cryptology-Algorithm-Lab</span>
  </a>
  <a href="https://sites.google.com/view/hucc/" target="_blank" rel="noopener noreferrer"
     title="Hanyang University Cryptography Club"
     class="cna-footer-pill">
    <i class="fas fa-graduation-cap"></i>
    <span>HUCC</span>
  </a>
</div>

<style>
.cna-footer-pills{
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 14px;
  margin: 0 0 22px 0;     /* breathing room before the copyright/social row */
  flex-wrap: wrap;
}
.cna-footer-pill{
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 20px;     /* 1.4x: was 8 / 14 */
  border: 1px solid var(--cna-line);
  border-radius: 999px;
  color: var(--cna-ink);
  text-decoration: none;
  font-size: 17px;        /* 1.3x: was 14 */
  font-weight: 600;
  background: var(--cna-paper);
  transition: border-color .18s ease, color .18s ease, transform .18s ease;
}
.cna-footer-pill i{
  font-size: 22px;        /* 1.3x: was 18 */
  line-height: 1;
}
.cna-footer-pill:hover{
  border-color: var(--cna-indigo-line);
  color: var(--cna-indigo);
  transform: translateY(-1px);
}
@media (max-width: 600px){
  .cna-footer-pills{
    justify-content: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .cna-footer-pill{ padding: 10px 16px; font-size: 15px; }
  .cna-footer-pill i{ font-size: 19px; }
}
</style>

<script>
(function () {
  /* round-9 #1: open every off-site link in a new tab so the user
     doesn't leave the homepage. Same-host and anchor (#) links are
     left alone so in-page nav and scrollspy work as expected. */
  document.querySelectorAll('a[href]').forEach(function (a) {
    var href = a.getAttribute('href');
    if (!href || href.charAt(0) === '#' || href.indexOf('mailto:') === 0) return;
    if (a.hostname && a.hostname !== window.location.hostname) {
      a.setAttribute('target', '_blank');
      var rel = (a.getAttribute('rel') || '').split(/\s+/);
      if (rel.indexOf('noopener') === -1) rel.push('noopener');
      if (rel.indexOf('noreferrer') === -1) rel.push('noreferrer');
      a.setAttribute('rel', rel.filter(Boolean).join(' '));
    }
  });

  /* round-9 #2: scrollspy for the homepage floating section TOC.
     Watches every h1/h2 inside .page__content and toggles
     .is-active on the matching .cna-page-toc-item link. */
  var toc = document.querySelector('.cna-page-toc');
  if (!toc) return;
  var items = toc.querySelectorAll('.cna-page-toc-item');
  var targets = [];
  items.forEach(function (it) {
    var sel = it.getAttribute('href');
    if (!sel || sel.charAt(0) !== '#') return;
    var node = document.querySelector(sel);
    if (node) targets.push({ id: sel.slice(1), node: node, item: it });
  });
  if (!targets.length) return;

  function setActive(id) {
    items.forEach(function (it) { it.classList.remove('is-active'); });
    var match = targets.find(function (t) { return t.id === id; });
    if (match) match.item.classList.add('is-active');
  }

  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      /* Pick the entry closest to the top of the viewport that is currently
         intersecting. Falls back to last seen section while scrolling past. */
      var visible = entries
        .filter(function (e) { return e.isIntersecting; })
        .sort(function (a, b) { return a.boundingClientRect.top - b.boundingClientRect.top; });
      if (visible.length) setActive(visible[0].target.id);
    }, {
      rootMargin: '-30% 0px -55% 0px',
      threshold: 0
    });
    targets.forEach(function (t) { io.observe(t.node); });
  } else {
    /* fall back: highlight whichever section header has been scrolled past most recently */
    window.addEventListener('scroll', function () {
      var scrollY = window.scrollY + window.innerHeight * 0.3;
      var current = targets[0];
      targets.forEach(function (t) {
        if (t.node.offsetTop <= scrollY) current = t;
      });
      setActive(current.id);
    });
  }

  /* Smooth scroll on TOC click; account for sticky masthead offset */
  items.forEach(function (it) {
    it.addEventListener('click', function (e) {
      var sel = it.getAttribute('href');
      if (!sel || sel.charAt(0) !== '#') return;
      var node = document.querySelector(sel);
      if (!node) return;
      e.preventDefault();
      var headerOffset = 80;
      var top = node.getBoundingClientRect().top + window.scrollY - headerOffset;
      window.scrollTo({ top: top, behavior: 'smooth' });
      history.replaceState(null, '', sel);
    });
  });
})();

/* ---------- Filter Chip Logic (News / Seminar parallel rows) ---------- */
(function () {
  var today = new Date();
  today.setHours(0, 0, 0, 0);

  function toDate(s) { return s ? new Date(s + 'T00:00:00') : null; }

  function applyFilter(row, cards, chip) {
    var kind = row.getAttribute('data-filter-kind');
    var filter = chip.getAttribute('data-filter');
    var wanted = filter.split(' ');
    var targetSel = row.getAttribute('data-filter-target');
    var target = targetSel ? document.querySelector(targetSel) : null;
    var visible = [];

    /* Seminar container: three view modes.
         All      -> remove data-view, keep default <details> grouping (restore
                     cards to their series' <details> in chronological order)
         Upcoming -> physically move sorted visible cards to #seminar-flat-view,
                     hide the grouped container. display:contents on <details>
                     does NOT propagate CSS `order` to the grid in Chrome, so
                     we move the DOM instead of trying to reorder via CSS.
         series   -> data-view="filtered", matching <details> visible with header */
    var flatView = document.getElementById('seminar-flat-view');
    if (target && kind === 'seminar' && flatView) {
      /* Remember each series block's authored open/closed state once, so the
         group and All views can restore it instead of leaving everything the
         last single-series click force-opened. */
      Array.prototype.slice.call(target.querySelectorAll('details[data-series-block]')).forEach(function (d) {
        if (!d.hasAttribute('data-open-default')) {
          d.setAttribute('data-open-default', d.open ? 'true' : 'false');
        }
        /* Upcoming mixes series in one flat grid, so each card carries the
           series name as a muted chip. Injected once here rather than being
           repeated in every card's markup; CSS only reveals it in flat view. */
        var label = d.getAttribute('data-series-label');
        if (!label) return;
        Array.prototype.slice.call(d.querySelectorAll('.cna-card')).forEach(function (c) {
          var head = c.querySelector('.cna-card-head');
          if (!head || head.querySelector('.cna-series-tag')) return;
          var tag = document.createElement('span');
          tag.className = 'cna-chip cna-chip-muted cna-series-tag';
          tag.textContent = label;
          var first = head.firstElementChild;
          head.insertBefore(tag, first ? first.nextSibling : null);
        });
      });
      /* Whenever we're NOT in Upcoming, ensure cards are back inside their
         original series' <details> in chronological order. This is idempotent
         and cheap (30-odd cards). */
      var needsRestore = filter !== 'upcoming';
      if (needsRestore) {
        cards.forEach(function (c) {
          var series = c.getAttribute('data-series');
          var block = target.querySelector('details[data-series-block="' + series + '"] .cna-card-grid');
          if (block && c.parentElement !== block) block.appendChild(c);
        });
        /* Sort each series' grid chronologically ascending */
        Array.prototype.slice.call(target.querySelectorAll('details[data-series-block]')).forEach(function (d) {
          var grid = d.querySelector('.cna-card-grid');
          if (!grid) return;
          var seriesCards = Array.prototype.slice.call(grid.querySelectorAll(':scope > .cna-card'));
          seriesCards.sort(function (a, b) {
            return toDate(a.getAttribute('data-date')) - toDate(b.getAttribute('data-date'));
          });
          seriesCards.forEach(function (c) { grid.appendChild(c); });
        });
      }

      if (filter === 'all') {
        target.removeAttribute('data-view');
        target.hidden = false;
        flatView.hidden = true;
        Array.prototype.slice.call(target.querySelectorAll('details[data-series-block]')).forEach(function (d) {
          d.open = d.getAttribute('data-open-default') === 'true';
        });
      } else if (filter === 'upcoming') {
        target.hidden = true;
        flatView.hidden = false;
        /* Physical move happens after visible[] is computed below */
      } else {
        target.setAttribute('data-view', 'filtered');
        target.hidden = false;
        flatView.hidden = true;
        /* A single-series chip opens its block; a group chip (several series
           in one data-filter, e.g. Prior) restores the authored state so the
           reader gets a list of headers instead of every session at once. */
        Array.prototype.slice.call(target.querySelectorAll('details[data-series-block]')).forEach(function (d) {
          d.open = wanted.length === 1 ? true : d.getAttribute('data-open-default') === 'true';
        });
      }
    }

    if (filter === 'all') {
      visible = cards.slice().sort(function (a, b) {
        return toDate(b.getAttribute('data-date')) - toDate(a.getAttribute('data-date'));
      });
    } else if (filter === 'recent') {
      visible = cards.slice().sort(function (a, b) {
        return toDate(b.getAttribute('data-date')) - toDate(a.getAttribute('data-date'));
      }).slice(0, 5);
    } else if (filter === 'upcoming') {
      visible = cards.slice()
        .filter(function (c) { return toDate(c.getAttribute('data-date')) >= today; })
        .sort(function (a, b) {
          return toDate(a.getAttribute('data-date')) - toDate(b.getAttribute('data-date'));
        })
        .slice(0, 5);
    } else if (kind === 'news') {
      visible = cards
        .filter(function (c) { return c.getAttribute('data-cat') === filter; })
        .sort(function (a, b) {
          return toDate(b.getAttribute('data-date')) - toDate(a.getAttribute('data-date'));
        });
    } else if (kind === 'seminar') {
      visible = cards
        .filter(function (c) { return wanted.indexOf(c.getAttribute('data-series')) !== -1; })
        .sort(function (a, b) {
          return toDate(a.getAttribute('data-date')) - toDate(b.getAttribute('data-date'));
        });
    }

    var visibleSet = new Set(visible);

    /* News grid: sort visible cards by date via CSS `order` — News cards are
       direct grid items so `order` works reliably. Seminar Upcoming uses
       physical DOM movement (below) instead. */
    if (kind === 'news') {
      visible.forEach(function (c, i) { c.style.order = String(i + 1); });
      cards.forEach(function (c) {
        if (!visibleSet.has(c)) c.style.order = '';
      });
    } else {
      cards.forEach(function (c) { c.style.order = ''; });
    }

    /* Seminar Upcoming: physically move sorted visible cards into
       #seminar-flat-view so cross-series chronological order actually renders. */
    if (kind === 'seminar' && filter === 'upcoming' && flatView) {
      visible.forEach(function (c) { flatView.appendChild(c); });
    }

    /* Upcoming with nothing ahead would leave the section blank, so point the
       reader at the sessions that have already run instead. */
    var flatEmpty = document.getElementById('seminar-flat-empty');
    if (flatEmpty) {
      flatEmpty.hidden = !(kind === 'seminar' && filter === 'upcoming' && visible.length === 0);
    }

    cards.forEach(function (c) {
      if (visibleSet.has(c)) c.removeAttribute('data-filter-hidden');
      else c.setAttribute('data-filter-hidden', 'true');
    });

    /* Seminar wrapper visibility. Only applies to the 'filtered' (series-chip)
       mode: hide <details> that end up with zero visible cards; the matching
       one keeps its summary header, chevron, and grid. 'All' and 'flat'
       (Upcoming) modes clear data-empty so nothing is unintentionally hidden. */
    if (target && kind === 'seminar') {
      Array.prototype.slice.call(target.querySelectorAll('details')).forEach(function (d) {
        if (filter === 'all' || filter === 'upcoming') {
          d.removeAttribute('data-empty');
          return;
        }
        var hasVisible = Array.prototype.slice.call(d.querySelectorAll('.cna-card'))
          .some(function (c) { return visibleSet.has(c); });
        if (hasVisible) d.removeAttribute('data-empty');
        else d.setAttribute('data-empty', 'true');
      });
    }
  }

  document.querySelectorAll('.cna-filter-row').forEach(function (row) {
    var targetSel = row.getAttribute('data-filter-target');
    var target = targetSel ? document.querySelector(targetSel) : null;
    if (!target) return;
    var cards = Array.prototype.slice.call(target.querySelectorAll('.cna-card'));
    var chips = Array.prototype.slice.call(row.querySelectorAll('.cna-filter-chip'));

    chips.forEach(function (chip) {
      chip.addEventListener('click', function () {
        chips.forEach(function (c) { c.setAttribute('aria-pressed', 'false'); });
        chip.setAttribute('aria-pressed', 'true');
        applyFilter(row, cards, chip);
      });
    });

    /* The empty-Upcoming notice offers a jump to Prior. Reuse the chip's own
       click path so aria-pressed and the view stay in sync. */
    if (row.getAttribute('data-filter-kind') === 'seminar') {
      var jump = document.querySelector('.cna-flat-empty-jump');
      if (jump) {
        jump.addEventListener('click', function () {
          var wanted = jump.getAttribute('data-jump-filter');
          var priorChip = chips.filter(function (c) {
            return c.getAttribute('data-filter') === wanted;
          })[0];
          if (priorChip) priorChip.click();
        });
      }
    }

    var defaultChip = chips.filter(function (c) { return c.getAttribute('aria-pressed') === 'true'; })[0] || chips[0];
    if (defaultChip) applyFilter(row, cards, defaultChip);
  });
})();
</script>

<script>
/* Gallery lightbox. Deliberately a separate IIFE: the block above bails out
   early (`if (!toc) return`) on pages without a floating TOC, and the Gallery
   page is one of them. */
(function () {
  var galleries = Array.prototype.slice.call(document.querySelectorAll('.cna-gallery'));
  if (!galleries.length) return;

  var box = null, imgEl, capEl, countEl, closeBtn, prevBtn, nextBtn;
  var group = [], index = 0, lastFocus = null;

  function build() {
    box = document.createElement('div');
    box.className = 'cna-lightbox';
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');
    box.setAttribute('aria-label', 'Photo viewer');
    box.hidden = true;
    box.innerHTML =
      '<button type="button" class="cna-lightbox-close" aria-label="Close">&times;</button>' +
      '<button type="button" class="cna-lightbox-nav cna-lightbox-prev" aria-label="Previous photo">&lsaquo;</button>' +
      '<figure class="cna-lightbox-figure">' +
        '<img alt="">' +
        '<figcaption class="cna-lightbox-caption" aria-live="polite"></figcaption>' +
        '<span class="cna-lightbox-count" aria-live="polite"></span>' +
      '</figure>' +
      '<button type="button" class="cna-lightbox-nav cna-lightbox-next" aria-label="Next photo">&rsaquo;</button>';
    document.body.appendChild(box);

    imgEl = box.querySelector('img');
    capEl = box.querySelector('.cna-lightbox-caption');
    countEl = box.querySelector('.cna-lightbox-count');
    closeBtn = box.querySelector('.cna-lightbox-close');
    prevBtn = box.querySelector('.cna-lightbox-prev');
    nextBtn = box.querySelector('.cna-lightbox-next');

    closeBtn.addEventListener('click', close);
    prevBtn.addEventListener('click', function () { step(-1); });
    nextBtn.addEventListener('click', function () { step(1); });
    /* Backdrop only — clicks on the photo or the buttons must not close. */
    box.addEventListener('click', function (e) { if (e.target === box) close(); });
    document.addEventListener('keydown', function (e) {
      if (box.hidden) return;
      if (e.key === 'Escape') { close(); }
      else if (e.key === 'ArrowLeft') { step(-1); }
      else if (e.key === 'ArrowRight') { step(1); }
    });

    /* Keep Tab inside the dialog. aria-modal only hides the page from screen
       readers — without this a keyboard user tabs onto links behind the scrim
       and the focus ring goes somewhere they cannot see. */
    box.addEventListener("keydown", function (e) {
      if (e.key !== "Tab") return;
      var f = Array.prototype.filter.call(box.querySelectorAll("button"), function (b) {
        return b.offsetParent !== null;   /* the nav buttons are hidden for single-photo groups */
      });
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });

    /* Swipe: every other photo viewer the visitor uses supports it. */
    var tx = 0, ty = 0;
    box.addEventListener("touchstart", function (e) {
      tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY;
    }, { passive: true });
    box.addEventListener("touchend", function (e) {
      var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
      if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
    }, { passive: true });
  }

  function show(i) {
    var tile = group[i];
    index = i;
    imgEl.src = tile.getAttribute('data-full');
    var cap = tile.getAttribute('data-caption') || '';
    imgEl.alt = cap;
    capEl.textContent = cap;
    capEl.hidden = !cap;
    countEl.textContent = (i + 1) + ' / ' + group.length;

    /* These are full-size phone photos; without this the next one arrives
       after the user has already asked for it. */
    [1, -1].forEach(function (d) {
      var t = group[(index + d + group.length) % group.length];
      if (t) { var p = new Image(); p.src = t.getAttribute("data-full"); }
    });
  }

  function step(delta) {
    if (group.length < 2) return;
    show((index + delta + group.length) % group.length);
  }

  function open(tiles, i) {
    if (!box) build();
    group = tiles;
    box.setAttribute('data-single', group.length < 2 ? 'true' : 'false');
    lastFocus = document.activeElement;
    show(i);
    box.hidden = false;
    /* Locking the scroll removes the scrollbar, which shifts the page under
       the scrim. Pay the width back as padding. */
    var gutter = window.innerWidth - document.documentElement.clientWidth;
    document.documentElement.style.overflow = "hidden";
    if (gutter > 0) document.documentElement.style.paddingRight = gutter + "px";
    closeBtn.focus();
  }

  function close() {
    box.hidden = true;
    imgEl.removeAttribute('src');
    document.documentElement.style.overflow = '';
    document.documentElement.style.paddingRight = "";
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  galleries.forEach(function (g) {
    var tiles = Array.prototype.slice.call(g.querySelectorAll('button.cna-gallery-tile'));
    tiles.forEach(function (tile, i) {
      tile.addEventListener('click', function () { open(tiles, i); });
    });
  });
})();
</script>
<!-- end custom footer snippets -->
